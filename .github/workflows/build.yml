name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply uploaded Gemini files
        run: |
          [ -f AiOracleClient.kt ] && cp AiOracleClient.kt app/src/main/java/com/example/network/AiOracleClient.kt || true
          [ -f OracleSettingsRepository.kt ] && cp OracleSettingsRepository.kt app/src/main/java/com/example/data/OracleSettingsRepository.kt || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: glyph-oracle-apk
          path: app/build/outputs/apk/debug/*.apk
